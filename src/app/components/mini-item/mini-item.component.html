    <div (click)="emitClick(element)" class="card">
        <div class="card-content">
          <p-avatar 
            image={{getImageLink(element.image)}}
            styleClass="mr-2" 
            shape="circle">
          </p-avatar>
          <div class="card-info">
            <h3 class="card-name">{{element.name}}</h3>

          </div>
        </div>
      </div>
