<div *ngFor="let item of list_of_element; let i = index">
  <div class="card">
      <div class="card-content">
        <p-avatar 
          image={{getImageLink(item.image)}}
          styleClass="mr-2" 
          size="xlarge" 
          shape="circle">
        </p-avatar>
        <div class="card-info">
          <h3 class="card-name">{{item.name}}</h3>
          <p class="card-description">{{item.description}}</p>
          <p class="card-price">{{item.price + '€'}} </p>
        </div>
      </div>
      <button class="add-button" (click)="emitIdProduct(item)">
        <i class="fas fa-plus"></i> Aggiungi
      </button>
    </div>
</div>
