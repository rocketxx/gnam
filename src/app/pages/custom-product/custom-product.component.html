 <div *ngIf="this.thereIsBaseProduct">

    [title]="this.order_item.menuItem.name"
    [price]="this.order_item.menuItem.price.toString()"
    [description]="this.order_item.menuItem.description" 
  ></app-read-only-card-v1> -->
  <app-product-card [readOnly]="true" [list_of_element]="getMenuItemIfExist()"></app-product-card>
 </div>
  <div *ngIf="_uniqueTypes && _uniqueTypes.length > 0">
    <p-stepper orientation="vertical">
        <p-stepperPanel header="Quantità">
          <ng-template pTemplate="content" let-nextCallback="nextCallback">
            <h4>{{getTypeTitle()}}</h4>
            <app-counter [quantity]="this.order_item.quantity" [defaultQuantity]="1" (quantityChanged)="setQuantity($event)"></app-counter>
            <div class="flex py-4 gap-2">
              <p-button label="Avanti" (onClick)="nextCallback.emit()" />
              <p-button *ngIf="this.thereIsBaseProduct" label="Va bene così, salva" (onClick)="Save()" />
            </div>
          </ng-template>
        </p-stepperPanel>
        
        <p-stepperPanel *ngFor="let ing of _uniqueTypes; let i = index" header={{ing}}>
          <!-- Condizione per il primo elemento -->
          <ng-template *ngIf="i === 0" pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback">
            <app-ingredients-list [ingredients_list]="filterByType(_uniqueTypes[i])" ></app-ingredients-list>
            <div class="flex py-4 gap-2">
              <p-button label="Indietro" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Avanti" (onClick)="nextCallback.emit()" />
            </div>
          </ng-template>
          <!-- Condizione per elementi intermedi -->
          <ng-template *ngIf="i > 0 && i < _uniqueTypes.length - 1" pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback">
            <app-ingredients-list [ingredients_list]="filterByType(_uniqueTypes[i])" ></app-ingredients-list>
            <div class="flex py-4 gap-2">
              <p-button label="Indietro" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Avanti" (onClick)="nextCallback.emit()" />
            </div>
          </ng-template>
          <!-- Condizione per l'ultimo elemento -->
          <ng-template *ngIf="i === _uniqueTypes.length - 1" pTemplate="content" let-prevCallback="prevCallback" let-nextCallback="nextCallback">
            <app-ingredients-list [ingredients_list]="filterByType(_uniqueTypes[i])" ></app-ingredients-list>
            <div class="flex py-4 gap-2">
              <p-button label="Indietro" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Avanti" (onClick)="nextCallback.emit()" />
            </div>
          </ng-template>

        </p-stepperPanel>

        <p-stepperPanel header="Note">
          <ng-template pTemplate="content" let-nextCallback="nextCallback" let-prevCallback="prevCallback">
            <div class="card flex justify-content-center">
              <textarea 
                  [(ngModel)]="order_item.note"
                  rows="5"
                  cols="30"
                  pInputTextarea 
                  [autoResize]="true">
              </textarea>
          </div>
            <div class="flex py-4 gap-2">
              <p-button label="Indietro" severity="secondary" (onClick)="prevCallback.emit()" />
              <p-button label="Fatto" (onClick)="Save()" />
            </div>
          </ng-template>
        </p-stepperPanel>

    </p-stepper>
  </div>
  <!-- aggiungi controllo se ingredient sono stati caricati -->
  <div *ngIf="!_uniqueTypes || _uniqueTypes.length === 0" class="skeleton-container">
    <p-skeleton width="22rem" height="10rem" borderRadius="16px"></p-skeleton>
    <p-skeleton width="22rem" height="10rem" borderRadius="16px"></p-skeleton>
    <p-skeleton width="22rem" height="10rem" borderRadius="16px"></p-skeleton>
    <p-skeleton width="22rem" height="10rem" borderRadius="16px"></p-skeleton>
  </div>

<p-toast [breakpoints]="{'920px': {width: '100%', right: '0', left: '0'}}"></p-toast>
