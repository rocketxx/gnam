<div class="card">
    <app-filter-list #filterList (itemClicked)="filterMenuList($event)" [myElements]="this.filter_items"></app-filter-list>
    <div class="container-detail">
        <h1 class="cool-title">{{this.restaurant_name}}</h1>
    
        <div class="container-button">
            <app-custom-button *ngIf="this.renderCustomFoodButtonBread" (click)="personalizza_prodotto('BREAD')"
                [icon]="'🍔'" [description]="'Crea panino personalizzato'"></app-custom-button>
        </div>
        <div class="container-button">
            <app-custom-button *ngIf="this.renderCustomFoodButtonBread" (click)="personalizza_prodotto('PIZZA')"
                [icon]="'🍕'" [description]="'Crea pizza personalizzata'"></app-custom-button>
        </div>
    
        <app-product-card (baseClicked)="BaseClicked($event)" [list_of_element]="currentMenuItems"></app-product-card>
    </div>    
</div>
